<h2>История действий</h2><div class="table-wrap"><table class="compact-table"><thead><tr><th>Дата</th><th>Событие</th><th>Пользователь</th><th>IP-адрес</th><th></th></tr></thead><tbody>{% for event in profile_activity %}<tr><td>{{ event.created_at|dt_compact }}</td><td>{{ event.event_label }}</td><td>{{ event.actor }}</td><td class="ip-address">{{ event.ip or '—' }}</td><td><button class="secondary" type="button" data-modal-open="activity{{ event.id }}">Подробнее</button><template id="template-activity{{ event.id }}"><div class="modal" id="activity{{ event.id }}"><div class="modalbox"><h2>{{ event.event_label }}</h2><dl class="profile-data"><dt>Код события</dt><dd>{{ event.raw_action }}</dd><dt>Объект</dt><dd>{{ event.target_type }} · {{ event.target_id }}</dd></dl><pre id="eventdata{{ event.id }}">{{ event.details_json }}</pre><button class="secondary" type="button" data-workspace-copy="eventdata{{ event.id }}">Копировать</button><button class="secondary" type="button" data-modal-close="activity{{ event.id }}">Закрыть</button></div></div></template></td></tr>{% else %}<tr><td colspan="5">Событий пока нет.</td></tr>{% endfor %}</tbody></table></div>{% include '_profile_pager.html' %}
