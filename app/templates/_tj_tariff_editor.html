<details class="panel" open><summary>Тариф TJ · TJS · C2C</summary>
<p>Только новые заявки. Создание тарифа не включает приём платежей. Диапазоны [от, до); пустая верхняя граница означает отсутствие предела.</p>
<form data-tj-tariff data-url="{{ cabinet_base }}/tj/tariffs">{{ csrf_input(request) }}
<label>Сторона</label><select name="party">{% if tj_tariff_party %}<option value="{{ tj_tariff_party }}">{{ 'Мерчант' if tj_tariff_party == 'merchant' else 'Трейдер' }}</option>{% else %}<option value="merchant">Мерчант</option><option value="trader">Трейдер</option>{% endif %}</select>
<input type="hidden" name="entity_id" value="{{ tj_tariff_entity or '' }}">
<div data-tj-tier-rows><div class="row" data-tj-tier><div><label>От, TJS</label><input name="minimum" type="number" value="10" min="10" step="0.01" required></div><div><label>До, TJS</label><input name="maximum" type="number" min="10" step="0.01"></div><div><label>Комиссия, %</label><input name="percent" aria-label="Комиссия, %" type="number" min="0" max="100" step="0.0001" required></div><button type="button" class="secondary" data-tj-remove>Удалить</button></div></div>
<button type="button" class="secondary" data-tj-add>Добавить диапазон</button>
<label>Начало действия</label><input name="effective_from" type="datetime-local" required>
<button class="primary" type="submit">{{ 'Сохранить и назначить тариф' if tj_tariff_entity else 'Создать общий тариф TJ' }}</button><div data-tj-result role="status"></div>
</form></details>
